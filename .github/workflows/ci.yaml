name: Pipeline CI-CD Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devops-static-website
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/devops-static-website:${{ github.sha }}
  LATEST_IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/devops-static-website:latest

jobs:
  build-and-push:
    name: Construire et publier l'image Docker
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Verifier les secrets Docker Hub requis
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME et DOCKERHUB_TOKEN doivent etre configures dans les secrets GitHub."
            exit 1
          fi

      - name: Afficher la configuration de l'image
        run: |
          echo "Image versionnee : $IMAGE_REF"
          echo "Image glissante : $LATEST_IMAGE_REF"

      - name: Se connecter a Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Construire l'image Docker
        run: |
          docker build \
            -t "$IMAGE_REF" \
            -t "$LATEST_IMAGE_REF" \
            .

      - name: Verifier l'image construite
        run: |
          docker image inspect "$IMAGE_REF" > /dev/null

      - name: Publier les tags de l'image Docker
        run: |
          docker push "$IMAGE_REF"
          docker push "$LATEST_IMAGE_REF"

  scan-trivy:
    name: Analyser l'image avec Trivy
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Executer l'analyse de vulnerabilites Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 1
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Televerser l'artefact du rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy
          path: trivy-report.txt

  deploy:
    name: Validation du deploiement
    needs:
      - build-and-push
      - scan-trivy
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter a Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Recuperer l'image validee
        run: |
          docker pull "$IMAGE_REF"

      - name: Demarrer le conteneur sur un runner GitHub-hosted
        run: |
          docker rm -f ci-app >/dev/null 2>&1 || true
          docker run -d \
            --name ci-app \
            -p 8080:80 \
            "$IMAGE_REF"

      - name: Executer le test rapide du conteneur deploie
        run: |
          sleep 5
          curl --fail http://127.0.0.1:8080

      - name: Nettoyer le conteneur
        if: always()
        run: |
          docker rm -f ci-app || true
